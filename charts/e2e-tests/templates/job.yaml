apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-tests
  labels:
    app.kubernetes.io/name: e2e-tests
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: demo-e2e
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
    argocd.argoproj.io/sync-wave: "10"
spec:
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-tests
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: demo-e2e
    spec:
      initContainers:
        - name: wait-for-app
          image: {{ .Values.wait.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - until curl --fail --silent --show-error "$APP_BASE_URL/hello"; do echo "waiting for greeting app"; sleep 5; done
          env:
            - name: APP_BASE_URL
              value: {{ .Values.appBaseUrl | quote }}
      containers:
        - name: tests
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_BASE_URL
              value: {{ .Values.appBaseUrl | quote }}
      restartPolicy: Never
