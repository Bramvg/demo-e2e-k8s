apiVersion: batch/v1
kind: Job
metadata:
  name: e2e-cleanup
  labels:
    app.kubernetes.io/name: e2e-cleanup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: demo-e2e
  annotations:
    argocd.argoproj.io/hook: PostSync,SyncFail
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded,HookFailed
    argocd.argoproj.io/sync-wave: "20"
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: e2e-cleanup
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: demo-e2e
    spec:
      serviceAccountName: e2e-cleanup
      restartPolicy: Never
      containers:
        - name: kubectl
          image: {{ .Values.cleanup.image }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              selector="${TARGET_LABEL_KEY}=${TARGET_LABEL_VALUE}"
              echo "Cleaning up resources with selector ${selector} in namespace ${POD_NAMESPACE}"
              kubectl delete deployment,service -l "${selector}" -n "${POD_NAMESPACE}" --ignore-not-found=true
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TARGET_LABEL_KEY
              value: {{ .Values.cleanup.targetLabelKey | quote }}
            - name: TARGET_LABEL_VALUE
              value: {{ .Values.cleanup.targetLabelValue | quote }}

