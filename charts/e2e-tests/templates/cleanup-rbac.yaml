apiVersion: v1
kind: ServiceAccount
metadata:
  name: e2e-cleanup
  labels:
    app.kubernetes.io/name: e2e-cleanup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: demo-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: e2e-cleanup
  labels:
    app.kubernetes.io/name: e2e-cleanup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: demo-e2e
rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
      - delete
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-cleanup
  labels:
    app.kubernetes.io/name: e2e-cleanup
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: demo-e2e
subjects:
  - kind: ServiceAccount
    name: e2e-cleanup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: e2e-cleanup

