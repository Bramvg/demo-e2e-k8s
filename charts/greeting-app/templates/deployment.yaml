apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeting-app
  labels:
    app.kubernetes.io/name: greeting-app
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: demo-e2e
    cleanup.demo-e2e/subject: greeting-app
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: greeting-app
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: greeting-app
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: demo-e2e
        cleanup.demo-e2e/subject: greeting-app
    spec:
      containers:
        - name: app
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          readinessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /hello
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
